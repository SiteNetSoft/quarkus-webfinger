name: Build

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  jvm:
    name: JVM (Quarkus ${{ matrix.quarkus }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        quarkus: [ "3.40.1", "latest" ]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Resolve Quarkus version
        id: q
        run: |
          if [ "${{ matrix.quarkus }}" = "latest" ]; then
            V=$(curl -s https://repo1.maven.org/maven2/io/quarkus/quarkus-bom/maven-metadata.xml | grep -oP '(?<=<version>)3\.\d+\.\d+(?=</version>)' | sort -V | tail -1)
          else
            V=${{ matrix.quarkus }}
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
      - name: Build quarkus-safe-fetch (sibling dependency)
        run: |
          git clone --depth 1 https://github.com/SiteNetSoft/quarkus-safe-fetch ../quarkus-safe-fetch
          mvn -B -T 8 -f ../quarkus-safe-fetch/pom.xml install -DskipTests -Dquarkus.version=${{ steps.q.outputs.version }}
      - run: mvn -B -T 8 verify -Dquarkus.version=${{ steps.q.outputs.version }}

  native:
    name: Native
    runs-on: ubuntu-latest
    needs: jvm
    steps:
      - uses: actions/checkout@v4
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: 21
          distribution: mandrel
          cache: maven
      - name: Build quarkus-safe-fetch (sibling dependency)
        run: |
          git clone --depth 1 https://github.com/SiteNetSoft/quarkus-safe-fetch ../quarkus-safe-fetch
          mvn -B -T 8 -f ../quarkus-safe-fetch/pom.xml install -DskipTests
      - run: >
          mvn -B -T 8 verify -Dnative
          -Dquarkus.native.additional-build-args=-J-XX:TieredStopAtLevel=1,--parallelism=8
